name: Atualizar painel (diário)

on:
  schedule:
    # 14h30 de Brasília (17h30 UTC), todo dia: depois do boletim PTAX do dia
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar dados oficiais do Banco Central
        run: python3 scripts/atualizar_painel.py

      - name: Salvar se houve mudança
        run: |
          if git diff --quiet -- painel.json; then
            echo "Sem valores novos."
            exit 0
          fi
          git config user.name "atualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add painel.json
          git commit -m "chore: atualiza painel com dados do Banco Central"
          git push
